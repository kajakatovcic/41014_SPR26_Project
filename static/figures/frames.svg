<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ca02c"/></marker>
    <marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>
  <rect width="900" height="510" fill="#ffffff"/>

  <!-- ===== Top view ===== -->
  <text x="40" y="32" font-size="15" font-weight="bold" fill="#222">Top view: the explore mission's frames (simulated room)</text>
  <rect x="40" y="50" width="420" height="360" fill="#fbfbfb" stroke="#888" stroke-width="2"/>
  <!-- obstacles -->
  <rect x="150" y="110" width="70" height="40" fill="#d9d9d9"/>
  <rect x="330" y="270" width="45" height="45" fill="#d9d9d9"/>
  <circle cx="140" cy="230" r="16" fill="#d9d9d9"/>
  <circle cx="310" cy="345" r="18" fill="#d9d9d9"/>

  <!-- world frame (evaluation only) -->
  <line x1="250" y1="230" x2="290" y2="230" stroke="#999" stroke-width="2" marker-end="url(#ar-g)"/>
  <line x1="250" y1="230" x2="250" y2="190" stroke="#999" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="256" y="250" fill="#888" font-size="12">{W} simulator world: evaluation only</text>

  <!-- reference marker {A} -->
  <rect x="40" y="290" width="6" height="20" fill="#222"/>
  <line x1="46" y1="300" x2="106" y2="300" stroke="#d62728" stroke-width="2.5" marker-end="url(#ar-x)"/>
  <line x1="46" y1="300" x2="46" y2="240" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#ar-y)"/>
  <text x="54" y="322" font-weight="bold" fill="#222">{A}</text>
  <text x="80" y="322" fill="#444" font-size="12">reference marker 1</text>

  <!-- dock marker {D} and pre-dock pose -->
  <rect x="430" y="100" width="22" height="40" fill="#bdbdbd"/>
  <rect x="424" y="110" width="6" height="20" fill="#222"/>
  <line x1="424" y1="120" x2="384" y2="120" stroke="#d62728" stroke-width="2.5" marker-end="url(#ar-x)"/>
  <line x1="424" y1="120" x2="424" y2="160" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#ar-y)"/>
  <text x="352" y="92" font-weight="bold" fill="#222">{D}</text>
  <text x="378" y="92" fill="#444" font-size="12">dock marker 0</text>
  <path d="M343,114 L355,126 M355,114 L343,126" stroke="#7b3fb5" stroke-width="2"/>
  <text x="322" y="145" fill="#7b3fb5" font-size="12">pre-dock</text>
  <line x1="46" y1="300" x2="424" y2="120" stroke="#7b3fb5" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- robot {R} -->
  <circle cx="200" cy="360" r="15" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="200" y1="360" x2="239" y2="337.5" stroke="#d62728" stroke-width="2.5" marker-end="url(#ar-x)"/>
  <line x1="200" y1="360" x2="177.5" y2="321" stroke="#2ca02c" stroke-width="2.5" marker-end="url(#ar-y)"/>
  <text x="222" y="380" font-weight="bold" fill="#222">{R}</text>
  <text x="248" y="380" fill="#444" font-size="12">estimate x&#770; = (x, y, &#952;) in {A}</text>
  <line x1="186" y1="354" x2="50" y2="301" stroke="#e377c2" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="70" y="352" fill="#c2449b" font-size="12">z = [&#961;, &#945;]</text>

  <text x="40" y="430" fill="#7b3fb5" font-size="12">DOCK_OFFSET: {D} in {A} = (3.79 m, 1.80 m, 180&#176;) in simulation,</text>
  <text x="40" y="447" fill="#7b3fb5" font-size="12">measured with a tape on hardware</text>

  <!-- ===== Side view ===== -->
  <text x="530" y="32" font-size="15" font-weight="bold" fill="#222">Side view: sensor mounts on the robot</text>
  <text x="530" y="54" font-size="12" fill="#555">axes: <tspan fill="#d62728" font-weight="bold">x</tspan>  <tspan fill="#2ca02c" font-weight="bold">y</tspan>  <tspan fill="#1f77b4" font-weight="bold">z</tspan></text>
  <line x1="540" y1="380" x2="880" y2="380" stroke="#888" stroke-width="2"/>
  <rect x="630" y="335" width="105" height="37" rx="4" fill="#efefef" stroke="#555"/>
  <circle cx="640" cy="375" r="5" fill="#777"/>
  <circle cx="680" cy="363.5" r="16.5" fill="#555"/>
  <rect x="643" y="312" width="25" height="23" rx="3" fill="#444"/>
  <rect x="717" y="320" width="11" height="13" rx="2" fill="#444"/>

  <!-- {R} -->
  <line x1="680" y1="380" x2="770" y2="380" stroke="#d62728" stroke-width="2.5" marker-end="url(#ar-x)"/>
  <line x1="680" y1="380" x2="680" y2="290" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#ar-z)"/>
  <text x="688" y="400" font-weight="bold" fill="#222">{R}</text>
  <text x="714" y="400" fill="#444" font-size="12">floor, between the wheels</text>

  <!-- {S} -->
  <circle cx="655.5" cy="317" r="3" fill="#fff"/>
  <line x1="655.5" y1="317" x2="655.5" y2="276" stroke="#1f77b4" stroke-width="2" marker-end="url(#ar-z)"/>
  <line x1="655.5" y1="317" x2="618" y2="317" stroke="#d62728" stroke-width="2" stroke-dasharray="2 2"/>
  <text x="548" y="290" font-weight="bold" fill="#222">{S}</text>
  <text x="574" y="290" fill="#444" font-size="12">LiDAR</text>

  <!-- {C} -->
  <circle cx="722.75" cy="326.5" r="3" fill="#fff"/>
  <line x1="722.75" y1="326.5" x2="800" y2="326.5" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#ar-z)"/>
  <line x1="722.75" y1="326.5" x2="722.75" y2="300" stroke="#2ca02c" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="722.75" y1="326.5" x2="722.75" y2="355" stroke="#2ca02c" stroke-width="2" marker-end="url(#ar-y)"/>
  <text x="742" y="314" font-weight="bold" fill="#222">{C}</text>
  <text x="768" y="314" fill="#444" font-size="12">camera</text>
  <text x="806" y="331" fill="#1f77b4" font-size="12">optical axis</text>

  <text x="540" y="424" fill="#333" font-size="12">T_RS = (&#8722;0.049, 0, 0.1255) m, scan angle 0 = x_R, CCW +</text>
  <text x="540" y="442" fill="#333" font-size="12">T_RC = (0.0855, 0, 0.107) m, rotated so that</text>
  <text x="540" y="460" fill="#333" font-size="12">z_C = x_R (forward), x_C = &#8722;y_R, y_C = &#8722;z_R (down)</text>

  <text x="40" y="478" fill="#333" font-size="12">Chain: {A} &#8594; {R} (estimated pose) &#8594; {C} (T_RC) &#8594; marker (PnP); {R} &#8594; {S} (T_RS).</text>
  <text x="40" y="496" fill="#333" font-size="12">{W} &#8594; {A} (true marker pose) is used only to plot estimates against ground truth.</text>
</svg>
